name: Test protected Yolk Yard
on:
  push:
    branches: [main, feature/browser-access-public-matches]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: protected-game-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:cloudflare
      - run: npm run test:cloudflare
      - run: npx playwright install --with-deps chromium
      - run: npm run test:access-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protected-game-checks
          path: test-results/access
          retention-days: 7
# Cloudflare deployment is connected by the owner; see HOSTING.md.
