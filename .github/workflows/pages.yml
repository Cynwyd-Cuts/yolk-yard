name: Test and publish Yolk Yard
on:
  push:
    branches: [main, match-setup]
    paths-ignore:
      - public/room-test.html
      - public/room-test.js
      - public/server-check.html
      - public/server-check.js
      - .github/workflows/publish-room-test.yml
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: yolk-game-${{ github.event_name }}-${{ contains(github.event.head_commit.message, '[publish-verified]') && github.sha || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: yolk-build
          path: dist
          retention-days: 7
  browser:
    # Explicit opt-in for releases whose browser changes were already verified locally.
    if: "!contains(github.event.head_commit.message, '[publish-verified]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: arena
            command: npm run test:browser
          - suite: visual
            command: node scripts/royale-solo-check.mjs && node scripts/royale-art-check.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yolk-game-checks-${{ matrix.suite }}
          path: test-results
          retention-days: 7
  # Require the build and release browser checks before publishing.
  # The longer multiplayer Royale suite remains available as npm run test:royale.
  test:
    if: always()
    needs: [build, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test suite
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          VERIFIED_RELEASE: ${{ contains(github.event.head_commit.message, '[publish-verified]') }}
        run: |
          test "$BUILD_RESULT" = success
          if [ "$VERIFIED_RELEASE" = true ]; then
            test "$BROWSER_RESULT" = skipped
          else
            test "$BROWSER_RESULT" = success
          fi
      - uses: actions/download-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: yolk-build
          path: dist
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

# Verified menu release: includes completed keybind capture verification.
