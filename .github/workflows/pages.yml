name: Test and publish Yolk Yard
on:
  push:
    branches: [main, feature/browser-access-public-matches]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: protected-game-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:cloudflare
      - run: npm run test:cloudflare
      - run: npx playwright install --with-deps chromium
      - run: npm run test:access-browser
      - run: npm run test:pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protected-game-checks
          path: test-results
          retention-days: 7
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
# Cloudflare builds the protected branch; Pages publishes main after verification.
